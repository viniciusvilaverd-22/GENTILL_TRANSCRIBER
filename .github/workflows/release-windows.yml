name: Windows Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/v0.3.0-rc1"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.lock.txt

      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt

      - name: Generate icon
        run: python generate_icon.py

      - name: Provision local Whisper model
        run: python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='Systran/faster-whisper-small', local_dir='models/whisper-small-ct2')"

      - name: Test
        run: python -m unittest -v test_transcriber.py test_transcriber_e2e.py

      - name: Build Windows RC
        run: python -m PyInstaller --noconfirm --clean --distpath dist-rc --workpath build-rc gentill_transcriber.spec

      - name: Verify packaged executable
        run: python verify_release.py --platform windows --dist-root dist-rc

      - name: Resolve release tag
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = "v0.3.0-rc1"
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package release
        shell: pwsh
        run: |
          $name = "Gentill-Transcriber-Windows-$env:RELEASE_TAG.zip"
          Compress-Archive -Path "dist-rc\Gentill Transcriber", "dist-rc\RELEASE_MANIFEST_windows.json" -DestinationPath $name
          "RELEASE_ARCHIVE=$name" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:RELEASE_TAG" "$env:RELEASE_ARCHIVE" "dist-rc\RELEASE_MANIFEST_windows.json" --target "${{ github.sha }}" --title "Gentill Transcriber $env:RELEASE_TAG" --generate-notes
