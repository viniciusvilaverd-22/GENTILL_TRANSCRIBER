name: Product v0.4 QA

on:
  push:
    branches:
      - "feature/product-v0.4"

jobs:
  windows-product-qa:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.in
            requirements-runtime-compat.txt
            requirements-build.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.in -r requirements-runtime-compat.txt -r requirements-build.txt

      - name: Generate icon
        run: python generate_icon.py

      - name: Fast product tests
        run: python -m unittest -v test_transcriber.py test_transcriber_e2e.ValidationTests test_product_features.py

      - name: Compile product sources
        run: python -m compileall -q transcriber.py transcriber_gui.py history_store.py diagnostics.py diarization_support.py model_manager.py installer_windows.py uninstaller_windows.py verify_release.py verify_installer.py sign_windows.py

      - name: Provision local Whisper model
        run: python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='Systran/faster-whisper-small', local_dir='models/whisper-small-ct2')"

      - name: Real-media source E2E
        run: python -m unittest -v test_transcriber_e2e.OfflineMediaE2ETests

      - name: Build full offline app
        run: python -m PyInstaller --noconfirm --clean --distpath dist-qa --workpath build-qa gentill_transcriber.spec

      - name: Verify packaged app
        run: python verify_release.py --platform windows --dist-root dist-qa

      - name: Prepare validated installer payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Copy-Item -Recurse -Force "dist-qa\Gentill Transcriber" "dist\Gentill Transcriber"

      - name: Build uninstaller
        run: python -m PyInstaller --noconfirm --clean --distpath dist-installer-tools --workpath build-installer-tools gentill_uninstaller.spec

      - name: Build setup
        run: python -m PyInstaller --noconfirm --clean --distpath dist-installer --workpath build-installer gentill_installer.spec

      - name: Verify setup
        run: python verify_installer.py --installer "dist-installer\Gentill Transcriber Setup.exe"

      - name: Build Lite
        run: python -m PyInstaller --noconfirm --clean --distpath dist-lite --workpath build-lite gentill_transcriber_lite.spec

      - name: Validate Lite executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist-lite\Gentill Transcriber Lite\Gentill Transcriber Lite.exe")) { throw "Lite executable missing" }
